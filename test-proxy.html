<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Тест прокси</title>
</head>
<body>
  <h1>Тест прокси GAS → Worker</h1>
  <button id="testGet">GET / (проверка связи)</button>
  <button id="testPost">POST (отправить сообщение)</button>
  <pre id="result"></pre>
  <script>
    const BASE_URL = 'https://script.google.com/macros/s/AKfycbxJVUc7wBhGQO9J1pUrEC6gPogmL1kl-z7t1n2fhjbvO_QOH8YpTzcVnoTGZ3xl1sVY/exec'; // замените на ваш GAS URL

    document.getElementById('testGet').onclick = function() {
      fetch(BASE_URL)
        .then(r => r.json())
        .then(data => {
          document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        })
        .catch(err => {
          document.getElementById('result').textContent = 'Ошибка: ' + err.message;
        });
    };

    document.getElementById('testPost').onclick = function() {
      const payload = {
        userID: 'test_proxy',
        userName: 'Test',
        message: 'Hello via proxy ' + new Date().toISOString(),
        msgId: 'test_' + Date.now()
      };
      fetch(BASE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(data => {
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById('result').textContent = 'Ошибка: ' + err.message;
      });
    };
  </script>
</body>
</html>
