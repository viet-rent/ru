<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Панель менеджера</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 20px auto; padding: 10px; }
    .user-block { border: 1px solid #ccc; padding: 12px; margin-bottom: 20px; border-radius: 8px; }
    .user-block h3 { margin-top: 0; }
    .msg { margin: 4px 0; }
    .msg .name { font-weight: bold; }
    .msg .time { font-size: 0.8rem; color: #888; }
    .reply-area { margin-top: 8px; display: flex; gap: 8px; }
    .reply-input { flex: 1; padding: 6px; border-radius: 20px; border: 1px solid #ccc; }
    .reply-btn { padding: 6px 16px; border-radius: 20px; border: none; background: #1a73e8; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Панель менеджера</h1>
  <div id="login-area">
    <label>Пароль: <input type="password" id="passwordInput"></label>
    <button id="loginBtn">Войти</button>
  </div>
  <div id="manager-content" style="display:none;">
    <div id="users-container"></div>
    <div id="status"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyL85Jrd_eiAXj6UAP0DlqqdLhWxVIAe9a9goN7UnY1_uAMje1PNUFnoU6Iyozrt7v8/exec'; // тот же URL
    const PASSWORD = 'ваш_пароль'; // установите свой

    const loginArea = document.getElementById('login-area');
    const content = document.getElementById('manager-content');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const usersContainer = document.getElementById('users-container');
    const statusDiv = document.getElementById('status');

    loginBtn.addEventListener('click', function() {
      if (passwordInput.value === PASSWORD) {
        loginArea.style.display = 'none';
        content.style.display = 'block';
        loadAllMessages();
        setInterval(loadAllMessages, 5000);
      } else {
        alert('Неверный пароль');
      }
    });

    function loadAllMessages() {
      fetch(API_URL) // без user_id, возвращает все
        .then(r => r.json())
        .then(data => {
          if (data.error) {
            statusDiv.textContent = 'Ошибка: ' + data.error;
            return;
          }
          const msgs = data.messages || [];
          renderAllUsers(msgs);
          statusDiv.textContent = 'Обновлено ' + new Date().toLocaleTimeString();
        })
        .catch(err => {
          statusDiv.textContent = 'Ошибка: ' + err.message;
        });
    }

    function renderAllUsers(msgs) {
      // Группируем по user_id
      const groups = {};
      msgs.forEach(msg => {
        if (!groups[msg.user_id]) groups[msg.user_id] = [];
        groups[msg.user_id].push(msg);
      });

      let html = '';
      for (const [userId, userMsgs] of Object.entries(groups)) {
        // сортируем по времени
        userMsgs.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        const userName = userMsgs[0]?.name || 'Гость';
        html += `<div class="user-block">
          <h3>${userName} (${userId})</h3>
          <div>`;
        userMsgs.forEach(m => {
          const isManager = m.role === 'manager';
          html += `<div class="msg" style="${isManager ? 'background:#ffd966;' : ''}">
            <span class="name">${m.name}</span>
            <span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span>
            : ${m.message}
          </div>`;
        });
        html += `</div>
          <div class="reply-area">
            <input type="text" class="reply-input" placeholder="Ответ для ${userName}..." data-userid="${userId}">
            <button class="reply-btn" data-userid="${userId}">Ответить</button>
          </div>
        </div>`;
      }
      usersContainer.innerHTML = html;

      // Назначаем обработчики на кнопки ответа
      document.querySelectorAll('.reply-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const userId = this.dataset.userid;
          const input = document.querySelector(`.reply-input[data-userid="${userId}"]`);
          const text = input.value.trim();
          if (!text) return;
          sendManagerReply(userId, text);
          input.value = '';
        });
      });
    }

    function sendManagerReply(userId, message) {
      const payload = {
        user_id: userId,
        name: 'Менеджер',
        message: message,
        role: 'manager'
      };
      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.textContent = 'Ответ отправлен';
        setTimeout(loadAllMessages, 1000);
      })
      .catch(err => {
        statusDiv.textContent = 'Ошибка: ' + err.message;
      });
    }
  </script>
</body>
</html>
