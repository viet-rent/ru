<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Панель менеджера</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 20px auto; padding: 10px; }
    #dialogs { display: flex; gap: 20px; }
    #userList { width: 200px; border-right: 1px solid #ccc; padding: 10px; }
    #chatArea { flex: 1; padding: 10px; }
    .dialog-item { cursor: pointer; padding: 8px; border-bottom: 1px solid #eee; }
    .dialog-item:hover { background: #f0f0f0; }
    .dialog-item.active { background: #d2e3fc; }
    #messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; background: white; border-radius: 8px; margin-bottom: 12px; }
    #input-area { display: flex; gap: 8px; }
    #msgInput { flex: 1; }
    #sendBtn { background: #1a73e8; color: white; border: none; padding: 8px 20px; cursor: pointer; }
    #status { margin-top: 8px; color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h2>Панель менеджера</h2>
  <div id="dialogs">
    <div id="userList">
      <h3>Диалоги</h3>
      <div id="userListItems"></div>
    </div>
    <div id="chatArea">
      <div id="currentUser"></div>
      <div id="messages"></div>
      <div id="input-area">
        <input type="text" id="msgInput" placeholder="Ответ пользователю...">
        <button id="sendBtn">Отправить</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/ВАШ_URL/exec'; // без параметра user (все сообщения)
    const POST_URL = 'https://script.google.com/macros/s/ВАШ_URL/exec';

    let messages = [];
    let users = [];
    let currentUserId = null;

    const userListItems = document.getElementById('userListItems');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('status');
    const currentUserDiv = document.getElementById('currentUser');

    function loadAllMessages() {
      fetch(API_URL)
        .then(r => r.json())
        .then(data => {
          if (data.error) {
            statusDiv.textContent = 'Ошибка: ' + data.error;
            statusDiv.className = 'error';
            return;
          }
          messages = data.messages || [];
          buildUserList();
          if (currentUserId) {
            renderMessagesForUser(currentUserId);
          }
          statusDiv.textContent = 'Обновлено ' + new Date().toLocaleTimeString();
          statusDiv.className = '';
        })
        .catch(err => {
          statusDiv.textContent = 'Ошибка загрузки: ' + err.message;
          statusDiv.className = 'error';
        });
    }

    function buildUserList() {
      const userSet = new Set();
      messages.forEach(m => {
        if (m.userID) userSet.add(m.userID);
      });
      users = Array.from(userSet);
      userListItems.innerHTML = users.map(uid => {
        const lastMsg = messages.filter(m => m.userID === uid).pop();
        const lastText = lastMsg ? lastMsg.value : '';
        return `<div class="dialog-item" data-user="${uid}">${uid} <span style="font-size:0.8rem;color:#888;">${lastText.substring(0,20)}</span></div>`;
      }).join('');
      // Клик по диалогу
      document.querySelectorAll('.dialog-item').forEach(el => {
        el.addEventListener('click', function() {
          const uid = this.dataset.user;
          currentUserId = uid;
          renderMessagesForUser(uid);
          document.querySelectorAll('.dialog-item').forEach(d => d.classList.remove('active'));
          this.classList.add('active');
          currentUserDiv.textContent = 'Диалог с ' + uid;
          msgInput.disabled = false;
          sendBtn.disabled = false;
          msgInput.focus();
        });
      });
    }

    function renderMessagesForUser(uid) {
      const userMessages = messages.filter(m => m.userID === uid);
      messagesDiv.innerHTML = userMessages.map(m => {
        const isManager = (m.name === 'Менеджер');
        return `<div class="msg ${isManager ? 'manager' : ''}">
          <span class="name">${m.name}</span>
          <span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span>
          <div class="text">${m.value}</div>
        </div>`;
      }).join('');
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
      if (!currentUserId) { alert('Выберите диалог'); return; }
      const text = msgInput.value.trim();
      if (!text) return;

      const payload = {
        userID: currentUserId,
        name: 'Менеджер',
        value: text
      };

      statusDiv.textContent = 'Отправка...';
      statusDiv.className = '';

      fetch(POST_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.textContent = '✅ Отправлено!';
        setTimeout(loadAllMessages, 1000);
      })
      .catch(err => {
        statusDiv.textContent = '❌ Ошибка: ' + err.message;
        statusDiv.className = 'error';
      });

      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    loadAllMessages();
    setInterval(loadAllMessages, 5000);
  </script>
</body>
</html>
