<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Панель менеджера</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 20px auto; padding: 10px; }
    #messages { height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; background: #f9f9f9; border-radius: 8px; margin-bottom: 12px; }
    .msg { margin: 6px 0; padding: 4px; border-bottom: 1px solid #eee; }
    .msg .name { font-weight: bold; }
    .msg .time { font-size: 0.8rem; color: #888; }
    .msg .userid { font-size: 0.7rem; color: #666; }
    input, select, button { padding: 8px; margin: 4px 0; border-radius: 8px; border: 1px solid #ccc; }
    #reply-area { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    #replyInput { flex: 3; min-width: 200px; }
    #sendReply { background: #28a745; color: white; border: none; padding: 8px 20px; cursor: pointer; }
    #status { margin-top: 8px; color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h2>Панель менеджера</h2>
  <div id="messages"></div>
  <div id="reply-area">
    <select id="userSelect" style="flex:1; min-width:150px;">
      <option value="">Выберите пользователя</option>
    </select>
    <input type="text" id="replyInput" placeholder="Введите ответ..." style="flex:3; min-width:200px;">
    <button id="sendReply">Отправить ответ</button>
  </div>
  <div id="status"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbz6w7mW7X8tyu4ftMNmXlJVSbyQuSEx-amlXY_dmlRQzvktlDmfucAFC6mNCtTp5HFZ/exec';
    const messagesDiv = document.getElementById('messages');
    const userSelect = document.getElementById('userSelect');
    const replyInput = document.getElementById('replyInput');
    const sendReplyBtn = document.getElementById('sendReply');
    const statusDiv = document.getElementById('status');

    function loadMessages() {
      fetch(API_URL) // без userID, получаем все
        .then(r => r.json())
        .then(data => {
          if (data.error) { statusDiv.textContent = 'Ошибка: ' + data.error; return; }
          renderMessages(data.messages || []);
          updateUserSelect(data.messages || []);
          statusDiv.textContent = 'Обновлено ' + new Date().toLocaleTimeString();
        })
        .catch(err => statusDiv.textContent = 'Ошибка загрузки: ' + err.message);
    }

    function renderMessages(msgs) {
      messagesDiv.innerHTML = msgs.map(m => {
        const isManager = (m.userID === 'manager');
        return `<div class="msg" style="${isManager ? 'background: #d4edda;' : ''}">
          <span class="name">${m.userName}</span>
          <span class="userid">(${m.userID})</span>
          <span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span>
          <div>${m.message}</div>
          ${m.targetUserID ? `<div style="font-size:0.8rem;color:#666;">→ для ${m.targetUserID}</div>` : ''}
        </div>`;
      }).join('');
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateUserSelect(msgs) {
      const users = new Set();
      msgs.forEach(m => {
        if (m.userID && m.userID !== 'manager') users.add(m.userID);
      });
      const currentVal = userSelect.value;
      userSelect.innerHTML = '<option value="">Выберите пользователя</option>';
      users.forEach(id => {
        const option = document.createElement('option');
        option.value = id;
        option.textContent = id;
        userSelect.appendChild(option);
      });
      if (currentVal && users.has(currentVal)) userSelect.value = currentVal;
    }

    function sendReply() {
      const targetUserID = userSelect.value;
      const replyText = replyInput.value.trim();
      if (!targetUserID) { statusDiv.textContent = 'Выберите пользователя'; return; }
      if (!replyText) { statusDiv.textContent = 'Введите текст ответа'; return; }

      const payload = {
        userID: 'manager',
        userName: 'Менеджер',
        message: replyText,
        targetUserID: targetUserID,
        isResponse: true
      };

      statusDiv.textContent = 'Отправка...';
      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.textContent = '✅ Ответ отправлен!';
        replyInput.value = '';
        setTimeout(loadMessages, 1000);
      })
      .catch(err => statusDiv.textContent = '❌ Ошибка: ' + err.message);
    }

    sendReplyBtn.onclick = sendReply;
    replyInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendReply(); });

    loadMessages();
    setInterval(loadMessages, 5000);
  </script>
</body>
</html>
