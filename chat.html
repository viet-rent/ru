<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Чат поддержки</title>
  <style>
    /* те же стили, что были, плюс небольшое дополнение */
    .msg.manager .text { background: #ffd966; }
  </style>
</head>
<body>
  <div id="chat">
    <h2>Чат поддержки</h2>
    <div id="user-id-area" style="margin-bottom: 12px;">
      <label>Ваш Email (для идентификации): <input type="email" id="userIdInput" placeholder="example@mail.com" style="width: 70%;"></label>
      <button id="setUserIdBtn">Установить</button>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="nameInput" placeholder="Ваше имя" value="Гость">
      <input type="text" id="msgInput" placeholder="Напишите сообщение...">
      <button id="sendBtn">Отправить</button>
    </div>
    <div id="status"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyL85Jrd_eiAXj6UAP0DlqqdLhWxVIAe9a9goN7UnY1_uAMje1PNUFnoU6Iyozrt7v8/exec'; // замените на ваш URL

    const messagesDiv = document.getElementById('messages');
    const nameInput = document.getElementById('nameInput');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('status');
    const userIdInput = document.getElementById('userIdInput');
    const setUserIdBtn = document.getElementById('setUserIdBtn');

    let currentUserId = localStorage.getItem('chat_user_id') || '';

    if (currentUserId) {
      userIdInput.value = currentUserId;
      userIdInput.disabled = true;
      setUserIdBtn.textContent = 'Изменить ID';
    }

    function setUserId() {
      const id = userIdInput.value.trim();
      if (id) {
        currentUserId = id;
        localStorage.setItem('chat_user_id', id);
        userIdInput.disabled = true;
        setUserIdBtn.textContent = 'Изменить ID';
        loadMessages();
        statusDiv.textContent = 'ID установлен: ' + id;
      } else {
        alert('Введите корректный email');
      }
    }

    setUserIdBtn.addEventListener('click', function() {
      if (userIdInput.disabled) {
        userIdInput.disabled = false;
        userIdInput.value = '';
        setUserIdBtn.textContent = 'Сохранить';
        return;
      }
      setUserId();
    });

    // Если уже есть ID, загружаем при старте
    if (currentUserId) {
      loadMessages();
    }

    function loadMessages() {
      if (!currentUserId) {
        statusDiv.textContent = 'Сначала укажите ваш Email';
        return;
      }
      const url = API_URL + '?user_id=' + encodeURIComponent(currentUserId);
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(data => {
          if (data.error) {
            statusDiv.textContent = 'Ошибка: ' + data.error;
            statusDiv.className = 'error';
            return;
          }
          const msgs = data.messages || [];
          renderMessages(msgs);
          statusDiv.textContent = 'Обновлено ' + new Date().toLocaleTimeString();
          statusDiv.className = '';
        })
        .catch(err => {
          statusDiv.textContent = 'Ошибка загрузки: ' + err.message;
          statusDiv.className = 'error';
        });
    }

    function renderMessages(msgs) {
      const currentName = nameInput.value.trim();
      messagesDiv.innerHTML = msgs.map(m => {
        const isOwn = (m.name === currentName && m.role === 'user');
        const isManager = (m.role === 'manager');
        return `<div class="msg ${isOwn ? 'own' : ''} ${isManager ? 'manager' : ''}">
          <span class="name">${m.name}</span>
          <span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span>
          <div class="text">${m.message}</div>
        </div>`;
      }).join('');
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
      if (!currentUserId) {
        statusDiv.textContent = 'Сначала укажите ваш Email';
        return;
      }
      const name = nameInput.value.trim() || 'Гость';
      const text = msgInput.value.trim();
      if (!text) return;

      const payload = { user_id: currentUserId, name, message: text, role: 'user' };

      statusDiv.textContent = 'Отправка...';
      statusDiv.className = '';

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.textContent = '✅ Отправлено!';
        setTimeout(loadMessages, 1000);
      })
      .catch(err => {
        statusDiv.textContent = '❌ Ошибка: ' + err.message;
        statusDiv.className = 'error';
      });

      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    // Автообновление каждые 5 секунд, если есть ID
    setInterval(() => {
      if (currentUserId) loadMessages();
    }, 5000);

    // Сохраняем имя
    nameInput.addEventListener('change', function() {
      localStorage.setItem('chat_username', this.value);
    });
    const savedName = localStorage.getItem('chat_username');
    if (savedName) nameInput.value = savedName;
  </script>
</body>
</html>
