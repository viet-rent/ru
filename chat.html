<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Тест POST в Google Sheets</title>
</head>
<body>
  <h1>Тест отправки в Google Sheets</h1>
  <button id="testBtn">Отправить тестовое сообщение</button>
  <pre id="result">Результат появится здесь...</pre>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwDIz1B2fynvWhMLZC7xWSHtYPrSQ16lbp4d_itm_YFl0ac4dnIX_fUusEcWPbFevhl/exec';

    document.getElementById('testBtn').onclick = function() {
      const payload = {
        name: 'Тестер',
        value: 'Привет, это тестовое сообщение! ' + new Date().toLocaleTimeString()
      };

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(data => {
        document.getElementById('result').textContent = '✅ Успешно! Ответ сервера: ' + JSON.stringify(data, null, 2);
      })
      .catch(error => {
        document.getElementById('result').textContent = '❌ Ошибка: ' + error.message;
      });
    };
  </script>
</body>
</html>
