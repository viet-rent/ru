<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Чат поддержки — VietRent</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* ===== СТИЛИ (полный набор) ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: white;
      padding: 16px 40px;
      border-bottom: 1px solid #ebebeb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #ff385c;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo i { font-size: 26px; }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .header-controls a {
      text-decoration: none;
      color: #222;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-controls a:hover { color: #ff385c; }
    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }
    .chat-container {
      max-width: 680px;
      width: 100%;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      border: 1px solid #ebebeb;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 500px;
    }
    .chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid #ebebeb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }
    .chat-header h2 {
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header h2 i { color: #ff385c; }
    .chat-header .status {
      font-size: 13px;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chat-header .status i { font-size: 10px; }
    .user-info {
      padding: 16px 24px;
      background: #f8f8f8;
      border-bottom: 1px solid #ebebeb;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
    }
    .user-info .contacts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      flex: 1;
    }
    .user-info .contacts input {
      padding: 6px 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 13px;
      background: white;
      outline: none;
      transition: border-color 0.2s;
      min-width: 140px;
      flex: 1;
    }
    .user-info .contacts input:focus { border-color: #ff385c; }
    .user-info .contacts input::placeholder { color: #aaa; }
    .messages-area {
      flex: 1;
      padding: 16px 24px;
      overflow-y: auto;
      max-height: 420px;
      min-height: 250px;
      background: #ffffff;
    }
    .messages-area .empty {
      text-align: center;
      color: #999;
      font-size: 15px;
      padding: 40px 0;
    }
    .messages-area .empty i {
      font-size: 40px;
      color: #ddd;
      margin-bottom: 12px;
      display: block;
    }
    .msg {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.2s ease;
    }
    .msg .msg-meta {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 2px;
    }
    .msg .msg-meta .name { font-weight: 600; font-size: 14px; color: #222; }
    .msg .msg-meta .time { font-size: 11px; color: #999; }
    .msg .bubble {
      background: #f1f3f5;
      padding: 10px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 15px;
      line-height: 1.5;
      display: inline-block;
      align-self: flex-start;
    }
    .msg .bubble img, .msg .bubble video {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      display: block;
      margin: 4px 0;
    }
    .msg.own {
      align-items: flex-end;
    }
    .msg.own .bubble {
      background: #ff385c;
      color: white;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }
    .msg.own .msg-meta .name { color: #ff385c; }
    .msg.manager .bubble {
      background: #fff3cd;
      border: 1px solid #ffc107;
    }
    .input-area {
      padding: 16px 24px;
      border-top: 1px solid #ebebeb;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input-row input[type="text"],
    .input-row textarea {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      background: white;
      font-family: 'Inter', sans-serif;
    }
    .input-row input[type="text"]:focus,
    .input-row textarea:focus {
      border-color: #ff385c;
      box-shadow: 0 0 0 3px rgba(255,56,92,0.1);
    }
    .input-row textarea {
      resize: none;
      min-height: 44px;
      max-height: 150px;
      line-height: 1.5;
    }
    .input-row .send-btn {
      background: #ff385c;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      height: 44px;
    }
    .input-row .send-btn:hover { background: #e01e4a; }
    .input-row .send-btn:active { transform: scale(0.97); }
    .input-row .send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .attach-btn {
      background: #ddd;
      border: none;
      border-radius: 40px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 18px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .attach-btn:hover { background: #ccc; }
    #status {
      padding: 8px 24px;
      font-size: 13px;
      color: #22c55e;
      background: #f0fdf4;
      border-top: 1px solid #ebebeb;
      display: none;
    }
    #status.error { color: #ef4444; background: #fef2f2; }
    #status.show { display: block; }
    @media (max-width: 768px) {
      .header { padding: 12px 16px; }
      .header .logo { font-size: 20px; }
      .header-controls a { font-size: 14px; }
      .main { padding: 20px 12px; }
      .chat-container { border-radius: 16px; }
      .chat-header { padding: 14px 16px; }
      .user-info { padding: 12px 16px; }
      .user-info .contacts input { min-width: 100px; }
      .messages-area { padding: 12px 16px; max-height: 350px; }
      .input-area { padding: 12px 16px; gap: 8px; }
      .input-row { flex-wrap: wrap; }
      .input-row input[type="text"] { min-width: 120px; }
      .input-row textarea { min-height: 40px; font-size: 14px; }
      .input-row .send-btn { height: 40px; font-size: 14px; padding: 8px 16px; }
    }
    @media (max-width: 480px) {
      .user-info { flex-direction: column; align-items: stretch; }
      .user-info .contacts { flex-direction: column; }
      .user-info .contacts input { min-width: unset; }
      .input-row { flex-direction: column; align-items: stretch; }
      .input-row .send-btn { justify-content: center; height: 44px; }
      .msg .bubble { max-width: 90%; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<header class="header">
  <a href="/" class="logo"><i class="fas fa-home"></i>VietRent</a>
  <div class="header-controls">
    <a href="/"><i class="fas fa-arrow-left"></i> На главную</a>
  </div>
</header>
<main class="main">
  <div class="chat-container">
    <div class="chat-header">
      <h2><i class="fas fa-comment-dots"></i> Чат поддержки</h2>
      <span class="status"><i class="fas fa-circle"></i> Онлайн</span>
    </div>
    <div class="user-info">
      <div class="contacts">
        <input type="email" id="emailInput" placeholder="Email (опционально)" autocomplete="email">
        <input type="tel" id="phoneInput" placeholder="Телефон (опционально)" autocomplete="tel">
      </div>
    </div>
    <div class="messages-area" id="messagesArea">
      <div class="empty">
        <i class="fas fa-comment-dots"></i>
        <p>Начните диалог — напишите нам, и мы ответим в ближайшее время.</p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <input type="text" id="nameInput" placeholder="Ваше имя" value="Гость">
      </div>
      <div class="input-row">
        <textarea id="msgInput" placeholder="Напишите сообщение или вставьте ссылку..." rows="1"></textarea>
        <button class="attach-btn" id="attachBtn" title="Прикрепить файл">📎</button>
        <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
        <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i> Отправить</button>
      </div>
    </div>
    <div id="status"></div>
  </div>
</main>
<script>
  // ============================================================
  //  FRONTEND CHAT (полная логика)
  // ============================================================

  const BASE_URL = 'https://script.google.com/macros/s/AKfycbz5xXv_o2e76eJnKWe5bt7UcFfNSLfbHTHNXJWrPgmO3wkSNeOUWymhczAQSl5V2wdZ/exec'; // замените на ваш GAS URL

  // ----- IP -----
  let userIP = 'unknown';
  (async function fetchIP() {
    try {
      const resp = await fetch('https://api.ipify.org?format=json');
      const data = await resp.json();
      userIP = data.ip;
    } catch (e) { /* ignore */ }
  })();

  // ----- USER ID -----
  let userID = localStorage.getItem('chat_user_id');
  if (!userID) {
    userID = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    localStorage.setItem('chat_user_id', userID);
  }

  const API_URL = BASE_URL + '?userID=' + encodeURIComponent(userID);
  const POST_URL = BASE_URL;

  // ----- Состояние -----
  let messages = [];
  let msgIds = new Set();

  // ----- DOM -----
  const messagesArea = document.getElementById('messagesArea');
  const nameInput = document.getElementById('nameInput');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusDiv = document.getElementById('status');
  const emailInput = document.getElementById('emailInput');
  const phoneInput = document.getElementById('phoneInput');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');

  // Восстановление сохранённых данных
  const savedName = localStorage.getItem('chat_username');
  if (savedName) nameInput.value = savedName;
  emailInput.value = localStorage.getItem('chat_email') || '';
  phoneInput.value = localStorage.getItem('chat_phone') || '';

  nameInput.addEventListener('change', () => localStorage.setItem('chat_username', nameInput.value));
  emailInput.addEventListener('change', () => localStorage.setItem('chat_email', emailInput.value));
  phoneInput.addEventListener('change', () => localStorage.setItem('chat_phone', phoneInput.value));

  // ----- Авто-расширение textarea -----
  function autoResize() {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 150) + 'px';
  }
  msgInput.addEventListener('input', autoResize);
  msgInput.addEventListener('focus', autoResize);

  // ----- Рендер -----
  function createMessageElement(m) {
    const isOwn = (m.userID === userID);
    const isManager = (m.userID === 'manager');
    const div = document.createElement('div');
    div.className = 'msg' + (isOwn ? ' own' : '') + (isManager ? ' manager' : '');
    const timeStr = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const nameDisplay = isOwn ? 'Вы' : (m.userName || 'Гость');

    let content = escHtml(m.message);
    // Если сообщение содержит ссылку на файл
    if (m.message.match(/\.(jpg|jpeg|png|gif|webp|mp4|mov|avi|webm)$/i)) {
      const isImage = m.message.match(/\.(jpg|jpeg|png|gif|webp)$/i);
      const isVideo = m.message.match(/\.(mp4|mov|avi|webm)$/i);
      if (isImage) {
        content = `<img src="${escHtml(m.message)}" style="max-width:200px; max-height:200px; border-radius:8px; display:block;">`;
      } else if (isVideo) {
        content = `<video controls style="max-width:200px; max-height:200px; border-radius:8px;"><source src="${escHtml(m.message)}"></video>`;
      }
    }

    div.innerHTML = `
      <div class="msg-meta">
        <span class="name">${escHtml(nameDisplay)}</span>
        <span class="time">${escHtml(timeStr)}</span>
      </div>
      <div class="bubble">${content}</div>
    `;
    return div;
  }

  function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ----- Загрузка сообщений -----
  function loadMessages() {
    fetch(API_URL, { cache: 'no-cache' })
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(data => {
        if (data.error) { console.warn(data.error); return; }
        const newMessages = data.messages || [];
        let added = 0;
        newMessages.forEach(m => {
          if (!msgIds.has(m.msgId)) {
            msgIds.add(m.msgId);
            messages.push(m);
            added++;
          }
        });
        if (added > 0) {
          localStorage.setItem('chat_messages', JSON.stringify(messages));
          renderAllMessages();
          const empty = messagesArea.querySelector('.empty');
          if (empty) empty.remove();
        }
        setStatus('', false);
      })
      .catch(err => {
        console.warn('Ошибка загрузки:', err.message);
        const stored = localStorage.getItem('chat_messages');
        if (stored) {
          try {
            const storedMsgs = JSON.parse(stored);
            if (storedMsgs.length > 0) {
              messages = storedMsgs;
              storedMsgs.forEach(m => msgIds.add(m.msgId));
              renderAllMessages();
              const empty = messagesArea.querySelector('.empty');
              if (empty) empty.remove();
            }
          } catch (e) {}
        }
      });
  }

  function renderAllMessages() {
    if (messages.length === 0) {
      if (!document.querySelector('.empty')) {
        messagesArea.innerHTML = `
          <div class="empty">
            <i class="fas fa-comment-dots"></i>
            <p>Начните диалог — напишите нам, и мы ответим в ближайшее время.</p>
          </div>
        `;
      }
      return;
    }
    const fragment = document.createDocumentFragment();
    messages.forEach(m => fragment.appendChild(createMessageElement(m)));
    messagesArea.innerHTML = '';
    messagesArea.appendChild(fragment);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  // ----- Отправка сообщения -----
  function sendMessage() {
    const name = nameInput.value.trim() || 'Гость';
    const text = msgInput.value.trim();
    if (!text) return;

    const email = emailInput.value.trim();
    const phone = phoneInput.value.trim();
    localStorage.setItem('chat_email', email);
    localStorage.setItem('chat_phone', phone);

    const msgId = userID + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
    const payload = {
      userID,
      userName: name,
      message: text,
      ip: userIP,
      email,
      phone,
      msgId,
      isResponse: false
    };

    // Оптимистичное добавление
    const tempMsg = {
      timestamp: new Date().toISOString(),
      userID,
      userName: name,
      message: text,
      ip: userIP,
      email,
      phone,
      msgId,
      isResponse: false
    };
    if (!msgIds.has(msgId)) {
      msgIds.add(msgId);
      messages.push(tempMsg);
      localStorage.setItem('chat_messages', JSON.stringify(messages));
      renderAllMessages();
      const empty = messagesArea.querySelector('.empty');
      if (empty) empty.remove();
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    msgInput.value = '';
    msgInput.style.height = 'auto';
    setStatus('Отправка...', false);
    sendBtn.disabled = true;

    fetch(POST_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      setStatus('Отправлено', false);
      setTimeout(loadMessages, 1000);
    })
    .catch(err => {
      setStatus('Ошибка отправки: ' + err.message, true);
    })
    .finally(() => {
      sendBtn.disabled = false;
    });
  }

  // ----- Загрузка файлов (отправка на GAS) -----
  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async function() {
    if (this.files.length === 0) return;
    const file = this.files[0];
    if (file.size > 10 * 1024 * 1024) {
      setStatus('Файл слишком большой (макс 10 МБ)', true);
      this.value = '';
      return;
    }

    const formData = new FormData();
    formData.append('file', file);

    setStatus('Загрузка файла...', false);
    try {
      const response = await fetch(BASE_URL, { // отправляем на тот же GAS-прокси
        method: 'POST',
        body: formData
      });
      const data = await response.json();
      if (data.success) {
        msgInput.value = data.url;
        setStatus('Файл загружен! Отправьте сообщение', false);
        autoResize();
      } else {
        setStatus('Ошибка загрузки: ' + (data.error || 'неизвестная'), true);
      }
    } catch (err) {
      setStatus('Ошибка загрузки: ' + err.message, true);
    }
    this.value = '';
  });

  // ----- Статус -----
  function setStatus(text, isError = false) {
    if (text) {
      statusDiv.textContent = text;
      statusDiv.className = 'show' + (isError ? ' error' : '');
    } else {
      statusDiv.className = '';
      statusDiv.textContent = '';
    }
  }

  // ----- События -----
  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ----- Запуск -----
  const stored = localStorage.getItem('chat_messages');
  if (stored) {
    try {
      const storedMsgs = JSON.parse(stored);
      if (storedMsgs.length > 0) {
        messages = storedMsgs;
        storedMsgs.forEach(m => msgIds.add(m.msgId));
        renderAllMessages();
        const empty = messagesArea.querySelector('.empty');
        if (empty) empty.remove();
      }
    } catch (e) {}
  }
  loadMessages();
  setInterval(loadMessages, 5000);
</script>
</body>
</html>
