<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Чат</title>
  <style>
    /* стили из предыдущего */
  </style>
</head>
<body>
  <div id="chat">
    <h2>Чат поддержки</h2>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="nameInput" placeholder="Ваше имя" value="Гость">
      <input type="text" id="msgInput" placeholder="Напишите сообщение...">
      <button id="sendBtn">Отправить</button>
    </div>
    <div id="status"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbz6w7mW7X8tyu4ftMNmXlJVSbyQuSEx-amlXY_dmlRQzvktlDmfucAFC6mNCtTp5HFZ/exec';
    
    // Генерируем или получаем userID
    let userID = localStorage.getItem('chat_user_id');
    if (!userID) {
      userID = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
      localStorage.setItem('chat_user_id', userID);
    }
    
    const messagesDiv = document.getElementById('messages');
    const nameInput = document.getElementById('nameInput');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('status');
    
    function loadMessages() {
      const url = API_URL + '?userID=' + encodeURIComponent(userID);
      fetch(url)
        .then(r => r.json())
        .then(data => {
          if (data.error) { statusDiv.textContent = 'Ошибка: ' + data.error; return; }
          renderMessages(data.messages || []);
          statusDiv.textContent = 'Обновлено ' + new Date().toLocaleTimeString();
        })
        .catch(err => statusDiv.textContent = 'Ошибка загрузки: ' + err.message);
    }
    
    function renderMessages(msgs) {
      const name = nameInput.value.trim() || 'Гость';
      messagesDiv.innerHTML = msgs.map(m => {
        const isOwn = (m.userID === userID);
        const isManager = (m.userID === 'manager');
        return `<div class="msg ${isOwn ? 'own' : ''} ${isManager ? 'support' : ''}">
          <span class="name">${m.userName}</span>
          <span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span>
          <div class="text">${m.message}</div>
        </div>`;
      }).join('');
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    function sendMessage() {
      const name = nameInput.value.trim() || 'Гость';
      const text = msgInput.value.trim();
      if (!text) return;
      
      const payload = {
        userID: userID,
        userName: name,
        message: text,
        isResponse: false
      };
      
      statusDiv.textContent = 'Отправка...';
      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.textContent = 'Отправлено!';
        setTimeout(loadMessages, 1000);
      })
      .catch(err => statusDiv.textContent = 'Ошибка: ' + err.message);
      
      msgInput.value = '';
    }
    
    sendBtn.onclick = sendMessage;
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
    
    loadMessages();
    setInterval(loadMessages, 5000);
    
    // сохраняем имя
    nameInput.addEventListener('change', function() {
      localStorage.setItem('chat_username', this.value);
    });
    const savedName = localStorage.getItem('chat_username');
    if (savedName) nameInput.value = savedName;
  </script>
</body>
</html>
