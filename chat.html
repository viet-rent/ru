<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Чат поддержки</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 10px; }
    #chat { border:1px solid #ccc; border-radius: 12px; padding: 16px; background: #f9f9f9; }
    #messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; background: white; border-radius: 8px; margin-bottom: 12px; }
    .msg { margin: 6px 0; }
    .msg .name { font-weight: bold; color: #1a73e8; }
    .msg .time { font-size: 0.75rem; color: #888; margin-left: 8px; }
    .msg .text { background: #e9ecef; padding: 4px 12px; border-radius: 12px; display: inline-block; max-width: 80%; }
    .msg.own .text { background: #d2e3fc; }
    .msg.own { text-align: right; }
    input, button { padding: 8px 12px; border-radius: 20px; border: 1px solid #ccc; margin: 4px 0; }
    #input-area { display: flex; gap: 8px; flex-wrap: wrap; }
    #nameInput { flex: 1; min-width: 100px; }
    #msgInput { flex: 3; min-width: 200px; }
    #sendBtn { background: #1a73e8; color: white; border: none; padding: 8px 20px; cursor: pointer; }
    #status { margin-top: 8px; color: green; }
    .error { color: red; }
    .contact-fields { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .contact-fields input { flex: 1; min-width: 120px; padding: 6px 12px; border-radius: 16px; border: 1px solid #ccc; }
    .ip-info { font-size: 0.8rem; color: #888; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="chat">
    <h2>Чат поддержки</h2>
    <div id="ipInfo" class="ip-info">IP: загрузка...</div>
    <div class="contact-fields">
      <input type="text" id="emailInput" placeholder="Email (опционально)">
      <input type="text" id="phoneInput" placeholder="Телефон (опционально)">
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="nameInput" placeholder="Ваше имя" value="Гость">
      <input type="text" id="msgInput" placeholder="Напишите сообщение...">
      <button id="sendBtn">Отправить</button>
    </div>
    <div id="status"></div>
  </div>

  <script>
    // ===== НАСТРОЙКИ =====
    const BASE_URL = 'https://script.google.com/macros/s/AKfycbwXpPc5XgwpU7SXXq1WxsqowbvhqYy1jU2lwM70LrpcH0VCAWAni9DBPmG4egUYMW-T/exec'; // замените на ваш URL

    // ===== Получение IP =====
    let userIP = 'unknown';
    async function fetchIP() {
      try {
        const resp = await fetch('https://api.ipify.org?format=json');
        const data = await resp.json();
        userIP = data.ip;
        document.getElementById('ipInfo').textContent = 'IP: ' + userIP;
      } catch (e) {
        console.warn('Не удалось получить IP:', e);
        document.getElementById('ipInfo').textContent = 'IP: не удалось определить';
      }
    }
    fetchIP();

    // ===== UserID =====
    let userID = localStorage.getItem('chat_user_id');
    if (!userID) {
      userID = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
      localStorage.setItem('chat_user_id', userID);
    }

    // ===== Контактные данные (localStorage) =====
    let savedEmail = localStorage.getItem('chat_email') || '';
    let savedPhone = localStorage.getItem('chat_phone') || '';
    let savedName = localStorage.getItem('chat_username') || 'Гость';

    const API_URL = BASE_URL + '?user=' + encodeURIComponent(userID);
    const POST_URL = BASE_URL;

    // ===== DOM =====
    const messagesDiv = document.getElementById('messages');
    const nameInput = document.getElementById('nameInput');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('status');
    const emailInput = document.getElementById('emailInput');
    const phoneInput = document.getElementById('phoneInput');

    // Восстанавливаем сохранённые данные
    nameInput.value = savedName;
    emailInput.value = savedEmail;
    phoneInput.value = savedPhone;

    // Сохраняем при изменении
    nameInput.addEventListener('change', function() {
      localStorage.setItem('chat_username', this.value);
    });
    emailInput.addEventListener('change', function() {
      localStorage.setItem('chat_email', this.value);
    });
    phoneInput.addEventListener('change', function() {
      localStorage.setItem('chat_phone', this.value);
    });

    // ===== Загрузка истории =====
    function loadMessages() {
      fetch(API_URL)
        .then(r => r.json())
        .then(data => {
          if (data.error) throw new Error(data.error);
          const msgs = data.messages || [];
          renderMessages(msgs);
          statusDiv.textContent = 'Обновлено ' + new Date().toLocaleTimeString();
          statusDiv.className = '';
        })
        .catch(err => {
          statusDiv.textContent = 'Ошибка загрузки: ' + err.message;
          statusDiv.className = 'error';
        });
    }

    function renderMessages(msgs) {
      const currentName = nameInput.value.trim();
      messagesDiv.innerHTML = msgs.map(m => {
        const isOwn = (m.name === currentName);
        return `<div class="msg ${isOwn ? 'own' : ''}">
          <span class="name">${m.name}</span>
          <span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span>
          <div class="text">${m.value}</div>
        </div>`;
      }).join('');
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // ===== Отправка сообщения =====
    function sendMessage() {
      const name = nameInput.value.trim() || 'Гость';
      const text = msgInput.value.trim();
      if (!text) return;

      // Собираем контактные данные (пользователь мог изменить)
      const email = emailInput.value.trim();
      const phone = phoneInput.value.trim();
      localStorage.setItem('chat_email', email);
      localStorage.setItem('chat_phone', phone);

      const payload = {
        userID: userID,
        name: name,
        value: text,
        ip: userIP,
        email: email,
        phone: phone
      };

      statusDiv.textContent = 'Отправка...';
      statusDiv.className = '';

      fetch(POST_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.textContent = '✅ Отправлено!';
        msgInput.value = '';
        setTimeout(loadMessages, 1000);
      })
      .catch(err => {
        statusDiv.textContent = '❌ Ошибка: ' + err.message;
        statusDiv.className = 'error';
      });
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    loadMessages();
    setInterval(loadMessages, 5000);
  </script>
</body>
</html>
